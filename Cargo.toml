[package]
name = "codu"
version = "0.2.0"
authors = ["H.G.Raubenheimer (with Claude)"]
edition = "2024"
rust-version = "1.88"
description = "Colourful, themeable, navigable disk usage TUI"
license = "GPL-3.0-or-later"
repository = "https://github.com/hilgardt-collab/codu"
keywords = ["disk", "usage", "tui", "ncdu", "terminal"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "7"
unicode-width = "0.2"
rayon = "1.12"
anyhow = "1"
globset = "0.4"
chrono = "0.4"
trash = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
